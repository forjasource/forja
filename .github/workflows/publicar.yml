on:
  push:
    branches: [main, master]
    paths:
      - 'forja.json'
      - 'script.forja/**'
      - '.github/scripts/release.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-forja
  cancel-in-progress: false

jobs:
  publicar:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: release
        run: python .github/scripts/release.py

      - run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No hay cambios que subir."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar Forja ${{ steps.release.outputs.version }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
